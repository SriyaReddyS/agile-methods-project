
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Animals | Wildlife Guardian</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="animal-data.js" defer></script>
    <script src="animal-cards.js" defer></script>
</head>

<body>

    <!-- Shared Header -->
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">

            <a href="index.html" class="logo">
                Wildlife Guardian
            </a>

            <!-- Mobile Menu Button -->
            <button
                class="menu-toggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
                aria-controls="primary-navigation">
                ☰
            </button>

            <!-- Navigation Links -->
            <ul class="nav-links" id="primary-navigation">
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="animals.html" aria-current="page">
                        Explore Animals
                    </a>
                </li>
                <li>
                    <a href="index.html#about">
                        About Us
                    </a>
                </li>
            </ul>

        </nav>
    </header>

    <!-- Animal Listing -->
    <main>
        <section class="hero hero-compact">
            <div class="hero-content">

                <h1>Explore Endangered Animals</h1>

                <p>
                    Discover endangered species
                    and learn about their habitats,
                    threats, and conservation status.
                </p>

            </div>
        </section>

        <!-- Cards built by animal-cards.js from ANIMALS in animal-data.js -->
        <section class="animals animals-directory">
            <div class="animal-filter-panel">
                <h2>Find Your Animal</h2>

                <div class="animal-filter-controls">

                    <div class="animal-search">
                        <label for="animal-search-input">Search Animals</label>
                        <input
                            type="text"
                            id="animal-search-input"
                            placeholder="Search by animal name..."
                        >
                        <!--<button type="button" id="clear-animal-search">
                            Clear
                        </button> -->
                    </div>

                    <div class="animal-filter">
                        <label for="status-filter">Conservation Status</label>

                        <select id="status-filter">
                            <option value="all">All Statuses</option>
                            <option value="Critically Endangered">Critically Endangered</option>
                            <option value="Endangered">Endangered</option>
                            <option value="Vulnerable">Vulnerable</option>
                        </select>
                    </div>

                    <div class="animal-filter">
                        <label for="habitat-filter">Habitat</label>

                        <select id="habitat-filter">
                            <option value="all">All Habitats</option>
                            <option value="temperate">Temperate Forest</option>
                            <option value="marine">Marine & Coastal</option>
                            <option value="tropical">Tropical Rainforest</option>
                        </select>
                    </div>

                </div>

                <div class="animal-filter-actions">
                    <button type="button" id="clear-animal-search">Clear Search</button>
                    <button type="button" id="reset-filters">Reset Filters</button>
                </div>
            
            </div>

            <h2 class="visually-hidden">Animal list</h2>
            <div class="animal-grid" data-animal-cards>
                <noscript>
                    <p>Please enable JavaScript to view the animal list.</p>
                </noscript>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Wildlife Guardian | Team 5</p>
    </footer>

</body>
</html>
